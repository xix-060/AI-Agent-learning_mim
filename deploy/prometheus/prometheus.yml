# Prometheus 抓取配置：5s 间隔，适配短周期实验观察
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "agent-api"
    static_configs:
      - targets: ["agent-api:8000"]   # compose 网络内服务名

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]   # 自监控
