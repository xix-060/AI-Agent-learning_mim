repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # 可再生演示工件（图表/报告），体积大但可脚本重现，单独放行
        exclude: ^(src/loadtest/report\.html|scholar_knowledge/docs/graph.*\.png|paper_vision_agent/docs/demo\.gif)$
      - id: check-merge-conflict
